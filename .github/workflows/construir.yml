# SPDX-License-Identifier: GPL-3.0-or-later
# Testa o Arruma em Linux, Windows e macOS e constrói as versões para instalar.
# Os testes correm em todas as alterações. As versões para instalar, que demoram (sobretudo
# no macOS) e levam consigo cerca de 1 GB de código-fonte de componentes de terceiros, só são
# construídas no ramo main, nas etiquetas vX.Y.Z e à mão (Actions → Construir e testar →
# Run workflow). Os ficheiros ficam em Actions → (execução) → Artifacts durante 14 dias; ao
# criar uma etiqueta vX.Y.Z, são também publicados numa versão (Releases) do GitHub, onde
# não expiram.
#
# Para cumprir a GPL e a LGPL sem ter de prometer o envio do código-fonte mais tarde, o
# código-fonte dos componentes de terceiros fica no mesmo sítio que os instaladores: sempre
# que outras pessoas os podem descarregar (repositório público ou versão publicada), o
# trabalho «fontes» junta-o à mesma execução, no artefacto arruma-codigo-fonte-terceiros, e o
# trabalho «limpar» retira os instaladores se isso falhar. Num repositório privado só se
# confirma que o código-fonte existe.
name: Construir e testar

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["README.md", "tests/avaliacao/**", ".github/workflows/avaliar-ia.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Ver o comentário no início e packaging/pyinstaller/arruma.spec.
  ARRUMA_FONTES_NA_EXECUCAO: ${{ (!github.event.repository.private || startsWith(github.ref, 'refs/tags/v')) && 'true' || 'false' }}

jobs:
  testes:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ARRUMA_TESTAR_LIXO: ${{ startsWith(matrix.os, 'ubuntu') && '0' || '1' }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pillow mutagen pypdf
      - run: python -m unittest discover -s tests -v

  linux:
    name: Linux (.deb)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: A etiqueta tem de ser igual à versão do Arruma
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(python3 -c 'import arruma; print(arruma.__version__)')"
      - run: packaging/linux/build-deb.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: arruma-linux-deb
          retention-days: 14
          path: dist/*.deb

  linux-instalar:
    name: Instalar o .deb (${{ matrix.os }})
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7  # para o instalar.sh
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: arruma-linux-deb
      - name: Cópia antiga na pasta pessoal (instalar.sh), que o pacote tem de retirar
        run: |
          ./instalar.sh
          ./instalar.sh | grep -q "já está instalado"  # a mesma versão não se reinstala
          test -f ~/.local/bin/arruma
      - name: Instalar como no Linux Mint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./arruma_*.deb xvfb
          test ! -e ~/.local/bin/arruma && test ! -e ~/.local/share/arruma-app
          test "$(command -v arruma)" = /usr/bin/arruma
      - name: A mesma versão não se reinstala, e o instalar.sh não esconde o pacote
        run: |
          sudo apt-get install -y ./arruma_*.deb | tee apt.txt
          grep -q "already the newest version" apt.txt
          if ./instalar.sh; then echo "::error::O instalar.sh instalou por cima do pacote."; exit 1; fi
      - name: Autoteste da aplicação instalada
        run: |
          xvfb-run -a arruma --self-test="$PWD/autoteste.txt"
          cat autoteste.txt
          grep -q "RESULTADO: OK" autoteste.txt

  windows:
    name: Windows (instalador)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-adwaita-icon-theme-legacy
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-mutagen
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-poppler
            zip
      - name: Versão
        run: echo "VERSAO=$(python -c 'import arruma; print(arruma.__version__)')" >> "$GITHUB_ENV"
      - name: Testes com o Python do pacote
        run: python -m unittest discover -s tests
      - name: Construir com o PyInstaller
        run: |
          # O cargo do servidor (fora do MSYS2) junta os textos das licenças das bibliotecas Rust.
          export PATH="$PATH:$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin"
          cargo --version
          pyinstaller packaging/pyinstaller/arruma.spec --noconfirm --clean
      - name: Autoteste da versão empacotada
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Arruma\Arruma.exe" -ArgumentList "--self-test=$PWD\autoteste.txt" -Wait -PassThru
          Get-Content autoteste.txt
          if ($p.ExitCode -ne 0) { throw "O autoteste falhou (código $($p.ExitCode))." }
      - name: Versão portátil (.zip)
        run: cd dist && zip -qr "Arruma-${VERSAO}-windows-portatil.zip" Arruma
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Q "/DAppVersion=$env:VERSAO" packaging\windows\arruma.iss
          if ($LASTEXITCODE -ne 0) { throw "O Inno Setup falhou." }
      - name: Instalar, não reinstalar a mesma versão, atualizar e não descer de versão
        shell: pwsh
        run: |
          $instalador = (Get-Item "dist\Arruma-$env:VERSAO-windows-instalador.exe").FullName
          $chave = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{18C83DB7-5EF6-4B5E-B0F4-8D1E10EE1738}_is1'
          function Instalar { (Start-Process $instalador -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru).ExitCode }
          function Versao { (Get-ItemProperty $chave).DisplayVersion }
          $c = Instalar
          if ($c -ne 0 -or (Versao) -ne $env:VERSAO) { throw "Primeira instalação falhou ($c, $(Versao))." }
          $exe = Join-Path (Get-ItemProperty $chave).InstallLocation 'Arruma.exe'
          $p = Start-Process $exe -ArgumentList "--self-test=$PWD\autoteste-instalado.txt" -Wait -PassThru
          Get-Content autoteste-instalado.txt
          if ($p.ExitCode -ne 0) { throw "O autoteste da aplicação instalada falhou." }
          $antes = (Get-Item $exe).LastWriteTimeUtc
          $c = Instalar
          if ($c -eq 0) { throw "A mesma versão foi reinstalada." }
          Set-ItemProperty $chave DisplayVersion '0.1.0'
          $c = Instalar
          if ($c -ne 0 -or (Versao) -ne $env:VERSAO) { throw "A atualização falhou ($c, $(Versao))." }
          Set-ItemProperty $chave DisplayVersion '9.9.9'
          $c = Instalar
          if ($c -eq 0 -or (Versao) -ne '9.9.9') { throw "Desceu de versão sem confirmação ($c, $(Versao))." }
          Write-Output "Mesma versão: recusada. Versão anterior: atualizada. Versão mais recente: mantida."
      - name: Relatório do autoteste
        if: always()
        run: cat autoteste.txt || true
      - uses: actions/upload-artifact@v7
        with:
          name: arruma-windows
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: fontes-windows
          retention-days: 14
          path: dist/componentes-*.json

  macos:
    name: macOS (${{ matrix.arch }})
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: apple-silicon }
          - { runner: macos-15-intel, arch: intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: GTK e Python do Homebrew
        run: |
          # O Pillow vem do Homebrew (e não da roda do PyPI) para que cada biblioteca que ele usa
          # tenha origem e código-fonte conhecidos no inventário de licenças.
          brew install python@3.14 pygobject3 gtk+3 adwaita-icon-theme librsvg pillow
          "$(brew --prefix python@3.14)/bin/python3.14" -m venv --system-site-packages venv
          venv/bin/pip install --quiet pyinstaller mutagen pypdf
          echo "ARRUMA_MACOS_MIN=$(sw_vers -productVersion | cut -d. -f1).0" >> "$GITHUB_ENV"
      - name: Testes com o Python do pacote
        env:
          ARRUMA_TESTAR_LIXO: "1"
        run: venv/bin/python -m unittest discover -s tests
      - name: Construir com o PyInstaller
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          # A assinatura ad hoc do .app tem de cobrir tudo, incluindo as licenças de terceiros.
          PYINSTALLER_STRICT_BUNDLE_CODESIGN_ERROR: "1"
          PYINSTALLER_VERIFY_BUNDLE_SIGNATURE: "1"
        run: |
          cargo --version  # junta os textos das licenças das bibliotecas Rust
          venv/bin/pyinstaller packaging/pyinstaller/arruma.spec --noconfirm --clean
      - name: Autoteste da versão empacotada
        run: |
          dist/Arruma.app/Contents/MacOS/Arruma --self-test="$PWD/autoteste.txt"
          cat autoteste.txt
          grep -q "RESULTADO: OK" autoteste.txt
      - name: Instalador (.pkg)
        run: packaging/macos/make-pkg.sh ${{ matrix.arch }}
      - name: Instalar, não reinstalar a mesma versão, atualizar e avisar antes de descer de versão
        run: |
          VERSAO="$(python3 -c 'import arruma; print(arruma.__version__)')"
          PKG="dist/Arruma-$VERSAO-macos-${{ matrix.arch }}.pkg"
          PLIST=/Applications/Arruma.app/Contents/Info.plist
          versao() { /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PLIST"; }
          instalar() { sudo installer -pkg "$PKG" -target / ; }
          sudo rm -rf /Applications/Arruma.app
          instalar
          test "$(versao)" = "$VERSAO"
          /Applications/Arruma.app/Contents/MacOS/Arruma --self-test="$PWD/autoteste-instalado.txt"
          cat autoteste-instalado.txt
          grep -q "RESULTADO: OK" autoteste-instalado.txt
          if instalar; then echo "::error::A mesma versão foi reinstalada."; exit 1; fi
          sudo plutil -replace CFBundleShortVersionString -string 0.1.0 "$PLIST"
          instalar
          test "$(versao)" = "$VERSAO"
          sudo plutil -replace CFBundleShortVersionString -string 9.9.9 "$PLIST"
          if instalar; then echo "Versão mais recente: o instalador avisou e continuou (na linha de comandos não há pergunta)."
          else echo "Versão mais recente: o instalador recusou."; fi
          echo "Versão instalada no fim: $(versao)"
      - uses: actions/upload-artifact@v7
        with:
          name: arruma-macos-${{ matrix.arch }}
          retention-days: 14
          path: dist/*.pkg
      - uses: actions/upload-artifact@v7
        with:
          name: fontes-macos-${{ matrix.arch }}
          retention-days: 14
          path: dist/componentes-*.json

  fontes:
    name: Código-fonte de terceiros
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: fontes-*
          path: fontes
          merge-multiple: true
      - name: Confirmar que o código-fonte de cada componente está disponível
        if: env.ARRUMA_FONTES_NA_EXECUCAO != 'true'
        run: python3 packaging/licencas/fontes.py --verificar fontes/*.json
      - name: Juntar o código-fonte de cada componente, no mesmo sítio que os instaladores
        if: env.ARRUMA_FONTES_NA_EXECUCAO == 'true'
        run: python3 packaging/licencas/fontes.py --saida fontes-terceiros fontes/*.json
      - uses: actions/upload-artifact@v7
        if: env.ARRUMA_FONTES_NA_EXECUCAO == 'true'
        with:
          name: arruma-codigo-fonte-terceiros
          retention-days: 14
          compression-level: 0  # são arquivos já comprimidos
          path: fontes-terceiros/*.tar

  limpar:
    name: Retirar instaladores sem código-fonte
    needs: [windows, macos, fontes]
    # Só quando os instaladores foram construídos para outras pessoas e o código-fonte não ficou junto.
    if: >-
      always() && needs.fontes.result != 'success' &&
      (needs.windows.result != 'skipped' || needs.macos.result != 'skipped') &&
      (!github.event.repository.private || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Apagar os instaladores de Windows e macOS desta execução
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | test("^arruma-(windows|macos-)")) | "\(.id) \(.name)"' |
          while read -r id nome; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            echo "Retirado: $nome"
          done
          echo "::error::O código-fonte de terceiros não ficou junto desta execução, por isso os instaladores de Windows e macOS foram retirados."
          exit 1

  publicar:
    name: Publicar versão
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [testes, linux-instalar, windows, macos, fontes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: arruma-*  # inclui arruma-codigo-fonte-terceiros
          path: artefactos
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artefactos/*
          generate_release_notes: true
          body: |
            Instaladores para Linux (.deb), Windows (instalador e versão portátil) e macOS (Apple Silicon e Intel).
            O Arruma é software livre (GPL-3.0 ou posterior). Os ficheiros .tar «codigo-fonte-terceiros» contêm o
            código-fonte dos componentes de outros autores incluídos nas versões de Windows e macOS; a lista e
            as licenças estão dentro de cada versão, na pasta «licencas».
