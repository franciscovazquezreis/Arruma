# SPDX-License-Identifier: GPL-3.0-or-later
# Testa o Arruma em Linux, Windows e macOS e constrói as versões para instalar.
# Os testes correm em todas as alterações. As versões para instalar, que demoram (sobretudo
# no macOS) e levam consigo cerca de 1 GB de código-fonte de componentes de terceiros, só são
# construídas no ramo main, nas etiquetas vX.Y.Z e à mão (Actions → Construir e testar →
# Run workflow). Os ficheiros ficam em Actions → (execução) → Artifacts durante 14 dias; ao
# criar uma etiqueta vX.Y.Z, são também publicados numa versão (Releases) do GitHub, onde
# não expiram.
#
# Para cumprir a GPL e a LGPL sem ter de prometer o envio do código-fonte mais tarde, o
# código-fonte dos componentes de terceiros fica no mesmo sítio que os instaladores: sempre
# que outras pessoas os podem descarregar (repositório público ou versão publicada), o
# trabalho «fontes» junta-o à mesma execução, no artefacto arruma-codigo-fonte-terceiros, e o
# trabalho «limpar» retira os instaladores se isso falhar. Num repositório privado só se
# confirma que o código-fonte existe.
name: Construir e testar

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["README.md", "tests/avaliacao/**", ".github/workflows/avaliar-ia.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Ver o comentário no início e packaging/pyinstaller/arruma.spec.
  ARRUMA_FONTES_NA_EXECUCAO: ${{ (!github.event.repository.private || startsWith(github.ref, 'refs/tags/v')) && 'true' || 'false' }}

jobs:
  testes:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ARRUMA_TESTAR_LIXO: ${{ startsWith(matrix.os, 'ubuntu') && '0' || '1' }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pillow mutagen pypdf
      - run: python -m unittest discover -s tests -v

  linux:
    name: Linux (.deb)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: A etiqueta tem de ser igual à versão do Arruma
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(python3 -c 'import arruma; print(arruma.__version__)')"
      - run: packaging/linux/build-deb.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: arruma-linux-deb
          retention-days: 14
          path: dist/*.deb

  linux-instalar:
    name: Instalar o .deb (${{ matrix.os }})
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # O código fica em src/: o «python3 -m arruma» lê primeiro a pasta atual, e o autoteste
      # tem de abrir o Arruma instalado, não o do código.
      - uses: actions/checkout@v7
        with:
          path: src
          persist-credentials: false
      # A versão publicada anterior, para testar a atualização verdadeira (a 0.2.0 ainda não
      # tinha preinst, postinst nem prerm).
      - uses: actions/checkout@v7
        with:
          ref: v0.2.0
          path: v0.2.0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: arruma-linux-deb
          path: deb
      - name: Preparar (Xvfb, histórico e definições de teste, versões 0.2.0 e 9.9.9)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          mkdir -p ~/.config/arruma ~/.local/share/arruma
          echo teste > ~/.config/arruma/marca && echo teste > ~/.local/share/arruma/marca
          v0.2.0/packaging/linux/build-deb.sh "$PWD/deb-0.2.0"
          # Um pacote igual ao verdadeiro, só com outro número de versão.
          cp -r src "$RUNNER_TEMP/v9.9.9"
          sed -i 's/^__version__ = .*/__version__ = "9.9.9"/' "$RUNNER_TEMP/v9.9.9/arruma/__init__.py"
          "$RUNNER_TEMP/v9.9.9/packaging/linux/build-deb.sh" "$PWD/deb-9.9.9"
          echo "VERSAO=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/arruma/__init__.py)" >> "$GITHUB_ENV"
      - name: instalar.sh (instala, não repete a mesma versão, atualiza a antiga, pergunta antes de descer)
        run: |
          copia=~/.local/share/arruma-app/arruma/__init__.py
          muda() { sed -i "s/^__version__ = .*/__version__ = \"$1\"/" "$copia"; }
          src/instalar.sh
          test -f ~/.local/bin/arruma
          # Sem o gtk-update-icon-cache não haveria cache de ícones, e o autoteste do fim não
          # mostraria se o pacote a invalida.
          test -f ~/.local/share/icons/hicolor/icon-theme.cache
          src/instalar.sh | tee saida.txt
          grep -q "Não há nada a atualizar" saida.txt
          muda 0.1.0
          src/instalar.sh | tee saida.txt
          grep -q "A atualizar o Arruma de 0.1.0 para $VERSAO" saida.txt
          grep "__version__" "$copia"
          grep -q "\"$VERSAO\"" "$copia"
          muda 9.9.9
          src/instalar.sh < /dev/null | tee saida.txt
          grep -q "Nada foi alterado" saida.txt
          grep "__version__" "$copia"
          grep -q '"9.9.9"' "$copia"
          if src/instalar.sh --remove; then echo "::error::Aceitou uma opção desconhecida."; exit 1; fi
          # Cópia da 0.2.0, cujo lançador abre a pasta do código: é a versão do código que conta.
          src/instalar.sh --remover
          v0.2.0/instalar.sh
          grep -q 'if \[ -d ' ~/.local/bin/arruma
          sed -i 's/^__version__ = .*/__version__ = "9.9.9"/' v0.2.0/arruma/__init__.py
          src/instalar.sh < /dev/null | tee saida.txt
          grep -q "Está instalado o Arruma 9.9.9 (em $PWD/v0.2.0)" saida.txt
          grep -q "Nada foi alterado" saida.txt
          grep -q 'if \[ -d ' ~/.local/bin/arruma
      - name: Atualizar a partir da 0.2.0 com a cópia da 0.2.0 a abrir código mais recente (a cópia fica)
        run: |
          sudo apt-get install -y ./deb-0.2.0/arruma_0.2.0_all.deb
          # O código compilado que o Python cria quando o Arruma corre como administrador.
          (cd / && sudo env PYTHONPATH=/usr/lib/arruma python3 -c "import arruma.core.planner")
          find /usr/lib/arruma -name __pycache__ | tee pycache.txt
          test -s pycache.txt
          sudo apt-get install -y "./deb/arruma_${VERSAO}_all.deb" | tee apt.txt
          grep "Arruma:" apt.txt
          grep -q "a versão 9.9.9, mais recente do que este pacote ($VERSAO)" apt.txt
          test "$(dpkg-query -W -f='${Version}' arruma)" = "$VERSAO"
          grep -q 'if \[ -d ' ~/.local/bin/arruma
          test -f ~/.local/share/applications/pt.arruma.Arruma.desktop
          test -f ~/.local/share/nemo/actions/arruma.nemo_action
          if src/instalar.sh > saida.txt; then echo "::error::O instalar.sh instalou por cima do pacote."; exit 1; fi
          cat saida.txt
          grep -q "(9.9.9) é mais recente do que o pacote" saida.txt
          if [ -n "$(find /usr/lib/arruma -name __pycache__)" ]; then
            echo "::error::Ficou código compilado da versão anterior em /usr/lib/arruma"; exit 1
          fi
      - name: Com a cópia da pasta pessoal mais antiga, o pacote retira-a
        run: |
          sed -i 's/^__version__ = .*/__version__ = "0.1.0"/' v0.2.0/arruma/__init__.py
          sudo apt-get install -y --reinstall "./deb/arruma_${VERSAO}_all.deb" | tee apt.txt
          grep "Arruma:" apt.txt
          grep -q "retirada a cópia antiga" apt.txt
          for f in ~/.local/bin/arruma ~/.local/share/arruma-app \
                   ~/.local/share/applications/pt.arruma.Arruma.desktop ~/.local/share/nemo/actions/arruma.nemo_action \
                   ~/.local/share/icons/hicolor/scalable/apps/pt.arruma.Arruma.svg; do
            if [ -e "$f" ]; then echo "::error::Ficou $f"; exit 1; fi
          done
          grep -q teste ~/.config/arruma/marca
          grep -q teste ~/.local/share/arruma/marca
          test "$(command -v arruma)" = /usr/bin/arruma
      - name: A mesma versão não se reinstala, e o instalar.sh não esconde o pacote
        run: |
          sudo apt-get install -y "./deb/arruma_${VERSAO}_all.deb" | tee apt.txt
          grep -q "already the newest version" apt.txt
          if src/instalar.sh > saida.txt; then echo "::error::O instalar.sh instalou por cima do pacote."; exit 1; fi
          cat saida.txt
          grep -q "já está instalado no sistema" saida.txt
          test ! -e ~/.local/share/arruma-app
      - name: Cache de ícones da pasta pessoal a indicar um ícone apagado à mão (o pacote refá-la)
        run: |
          # Sem isto, o menu e a barra de tarefas mostram um quadrado vazio em vez do ícone.
          mkdir -p ~/.local/share/icons/hicolor/scalable/apps
          cp src/arruma/ui/arruma.svg ~/.local/share/icons/hicolor/scalable/apps/pt.arruma.Arruma.svg
          gtk-update-icon-cache -f -t ~/.local/share/icons/hicolor
          rm ~/.local/share/icons/hicolor/scalable/apps/pt.arruma.Arruma.svg
          LC_ALL=C grep -qF pt.arruma.Arruma ~/.local/share/icons/hicolor/icon-theme.cache
          sudo apt-get install -y --reinstall "./deb/arruma_${VERSAO}_all.deb"
          if [ -f ~/.local/share/icons/hicolor/icon-theme.cache ] &&
             LC_ALL=C grep -qF pt.arruma.Arruma ~/.local/share/icons/hicolor/icon-theme.cache; then
            echo "::error::A cache de ícones da pasta pessoal ainda indica o ícone apagado."; exit 1
          fi
          echo "A cache de ícones da pasta pessoal já não indica o ícone apagado."
      - name: Com uma versão mais recente instalada, o apt não desce sem confirmação
        run: |
          sudo apt-get install -y ./deb-9.9.9/arruma_9.9.9_all.deb
          if sudo apt-get install -y "./deb/arruma_${VERSAO}_all.deb"; then
            echo "::error::Desceu de versão sem confirmação."; exit 1
          fi
          test "$(dpkg-query -W -f='${Version}' arruma)" = 9.9.9
          sudo apt-get install -y --allow-downgrades "./deb/arruma_${VERSAO}_all.deb"
          test "$(dpkg-query -W -f='${Version}' arruma)" = "$VERSAO"
      - name: Autoteste da aplicação instalada
        working-directory: ${{ runner.temp }}
        run: |
          xvfb-run -a arruma --self-test="$RUNNER_TEMP/autoteste.txt"
          cat autoteste.txt
          grep -q "RESULTADO: OK" autoteste.txt
          grep -q "Ícone no tema do sistema: OK" autoteste.txt
          grep -q "^Licença: /usr/" autoteste.txt
          grep -q teste ~/.config/arruma/marca
          grep -q teste ~/.local/share/arruma/marca
          echo "O histórico e as definições de teste continuam lá."

  windows:
    name: Windows (instalador)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-adwaita-icon-theme-legacy
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-mutagen
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-poppler
            zip
      - name: Versão
        run: echo "VERSAO=$(python -c 'import arruma; print(arruma.__version__)')" >> "$GITHUB_ENV"
      - name: Testes com o Python do pacote
        run: python -m unittest discover -s tests
      - name: Construir com o PyInstaller
        run: |
          # O cargo do servidor (fora do MSYS2) junta os textos das licenças das bibliotecas Rust.
          export PATH="$PATH:$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin"
          cargo --version
          pyinstaller packaging/pyinstaller/arruma.spec --noconfirm --clean
      - name: Autoteste da versão empacotada
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Arruma\Arruma.exe" -ArgumentList "--self-test=$PWD\autoteste.txt" -Wait -PassThru
          Get-Content autoteste.txt
          if ($p.ExitCode -ne 0) { throw "O autoteste falhou (código $($p.ExitCode))." }
      - name: Versão portátil (.zip)
        run: cd dist && zip -qr "Arruma-${VERSAO}-windows-portatil.zip" Arruma
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Q "/DAppVersion=$env:VERSAO" packaging\windows\arruma.iss
          if ($LASTEXITCODE -ne 0) { throw "O Inno Setup falhou." }
      - name: Instalar, não reinstalar a mesma versão, atualizar e não descer de versão
        shell: pwsh
        run: |
          $instalador = (Get-Item "dist\Arruma-$env:VERSAO-windows-instalador.exe").FullName
          $chave = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{18C83DB7-5EF6-4B5E-B0F4-8D1E10EE1738}_is1'
          function Instalar($nome) {
            (Start-Process $instalador -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$PWD\$nome.log" -Wait -PassThru).ExitCode
          }
          function Versao { (Get-ItemProperty $chave).DisplayVersion }
          # O registo do instalador mostra a mensagem (suprimida) e a recusa.
          function Recusou($nome, $motivo) {
            $linhas = Select-String -Path "$nome.log" -SimpleMatch $motivo, 'InitializeSetup returned False'
            $linhas | ForEach-Object { $_.Line }
            if (-not ($linhas | Where-Object { $_.Line -like "*$motivo*" }) -or
                -not ($linhas | Where-Object { $_.Line -like '*InitializeSetup returned False*' })) {
              Get-Content "$nome.log"; throw "O instalador não recusou pelo motivo esperado ($nome)."
            }
          }
          function Autoteste($nome) {
            $p = Start-Process $exe -ArgumentList "--self-test=$PWD\$nome.txt" -Wait -PassThru
            Get-Content "$nome.txt"
            if ($p.ExitCode -ne 0) { throw "O autoteste da aplicação instalada falhou ($nome)." }
          }
          function Ficheiros($raiz) {
            $raiz = $raiz.TrimEnd('\')
            Get-ChildItem $raiz -Recurse -File | ForEach-Object { $_.FullName.Substring($raiz.Length) } |
              Where-Object { $_ -notlike '\unins000.*' } | Sort-Object
          }

          # Histórico e definições de teste, que têm de ficar
          $dados = Join-Path $env:APPDATA 'Arruma'
          New-Item -ItemType Directory -Force $dados | Out-Null
          Set-Content (Join-Path $dados 'marca') 'teste'

          # Primeira instalação
          $c = Instalar 'primeira'
          if ($c -ne 0 -or (Versao) -ne $env:VERSAO) { throw "Primeira instalação falhou ($c, $(Versao))." }
          $pasta = (Get-ItemProperty $chave).InstallLocation
          $exe = Join-Path $pasta 'Arruma.exe'
          Autoteste 'autoteste-instalado'

          # A mesma versão não se reinstala
          $c = Instalar 'mesma'
          if ($c -eq 0) { throw "A mesma versão foi reinstalada." }
          Recusou 'mesma' 'nada a atualizar'

          # Uma versão anterior é atualizada, sem deixar ficheiros dela
          Set-ItemProperty $chave DisplayVersion '0.1.0'
          Set-Content (Join-Path $pasta '_internal\obsoleto.txt') 'da versão anterior'
          $c = Instalar 'anterior'
          if ($c -ne 0 -or (Versao) -ne $env:VERSAO) { throw "A atualização falhou ($c, $(Versao))." }
          $diferencas = Compare-Object (Ficheiros $pasta) (Ficheiros (Resolve-Path 'dist\Arruma').Path)
          if ($diferencas) { $diferencas | Out-String | Write-Output; throw "A pasta instalada não ficou igual à versão nova." }
          Autoteste 'autoteste-atualizado'

          # Uma versão mais recente não é substituída sem confirmação
          Set-ItemProperty $chave DisplayVersion '9.9.9'
          $c = Instalar 'recente'
          if ($c -eq 0 -or (Versao) -ne '9.9.9') { throw "Desceu de versão sem confirmação ($c, $(Versao))." }
          Recusou 'recente' 'mais recente do que a vers'

          # Um registo de instalação sem o Arruma.exe conta como não instalado
          Set-ItemProperty $chave DisplayVersion $env:VERSAO
          Remove-Item $exe
          $c = Instalar 'sem-exe'
          if ($c -ne 0 -or -not (Test-Path $exe) -or (Versao) -ne $env:VERSAO) { throw "Não reinstalou o Arruma em falta ($c, $(Versao))." }
          Autoteste 'autoteste-reinstalado'

          if ((Get-Content (Join-Path $dados 'marca')) -ne 'teste') { throw "O histórico e as definições não ficaram." }
          Write-Output "Mesma versão: recusada. Anterior: atualizada. Mais recente: mantida. Sem o Arruma.exe: reinstalada. Histórico e definições: ficaram."
      - name: Relatório do autoteste
        if: always()
        run: cat autoteste.txt || true
      - uses: actions/upload-artifact@v7
        with:
          name: arruma-windows
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: fontes-windows
          retention-days: 14
          path: dist/componentes-*.json

  macos:
    name: macOS (${{ matrix.arch }})
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: apple-silicon }
          - { runner: macos-15-intel, arch: intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: GTK e Python do Homebrew
        run: |
          # O Pillow vem do Homebrew (e não da roda do PyPI) para que cada biblioteca que ele usa
          # tenha origem e código-fonte conhecidos no inventário de licenças.
          brew install python@3.14 pygobject3 gtk+3 adwaita-icon-theme librsvg pillow
          "$(brew --prefix python@3.14)/bin/python3.14" -m venv --system-site-packages venv
          venv/bin/pip install --quiet pyinstaller mutagen pypdf
          echo "ARRUMA_MACOS_MIN=$(sw_vers -productVersion | cut -d. -f1).0" >> "$GITHUB_ENV"
      - name: Testes com o Python do pacote
        env:
          ARRUMA_TESTAR_LIXO: "1"
        run: venv/bin/python -m unittest discover -s tests
      - name: Construir com o PyInstaller
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          # A assinatura ad hoc do .app tem de cobrir tudo, incluindo as licenças de terceiros.
          PYINSTALLER_STRICT_BUNDLE_CODESIGN_ERROR: "1"
          PYINSTALLER_VERIFY_BUNDLE_SIGNATURE: "1"
        run: |
          cargo --version  # junta os textos das licenças das bibliotecas Rust
          venv/bin/pyinstaller packaging/pyinstaller/arruma.spec --noconfirm --clean
      - name: Autoteste da versão empacotada
        run: |
          dist/Arruma.app/Contents/MacOS/Arruma --self-test="$PWD/autoteste.txt"
          cat autoteste.txt
          grep -q "RESULTADO: OK" autoteste.txt
      - name: Instalador (.pkg)
        run: packaging/macos/make-pkg.sh ${{ matrix.arch }}
      - name: Instalar, não reinstalar a mesma versão, atualizar e não descer de versão
        run: |
          VERSAO="$(python3 -c 'import arruma; print(arruma.__version__)')"
          PKG="dist/Arruma-$VERSAO-macos-${{ matrix.arch }}.pkg"
          APP=/Applications/Arruma.app
          PLIST="$APP/Contents/Info.plist"
          versao() { /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PLIST"; }
          muda() { sudo plutil -replace CFBundleShortVersionString -string "$1" "$PLIST"; }
          instalar() { local c=0; sudo installer -pkg "$PKG" -target / > saida.txt 2>&1 || c=$?; cat saida.txt; return $c; }
          recusa() {
            if instalar; then echo "::error::$1"; exit 1; fi
          }
          # A aplicação instalada tem de ser igual à construída: os mesmos ficheiros e ligações, com
          # o mesmo conteúdo (fora o Info.plist, cuja versão os testes alteram).
          inventario() {
            (cd "$1" && find . -type f ! -path ./Contents/Info.plist -print0 | sort -z | xargs -0 shasum -a 256 &&
               find . -type l -print0 | sort -z | xargs -0 stat -f '%N -> %Y') | shasum
          }
          completa() {
            if [ "$(inventario "$APP")" != "$(inventario dist/Arruma.app)" ]; then
              echo "::error::A aplicação instalada não é igual à construída."; exit 1
            fi
          }
          autoteste() {
            "$APP/Contents/MacOS/Arruma" --self-test="$PWD/$1.txt"
            cat "$1.txt"
            grep -q "RESULTADO: OK" "$1.txt"
          }

          # Histórico e definições de teste, que têm de ficar
          DADOS="$HOME/Library/Application Support/Arruma"
          mkdir -p "$DADOS" && echo teste > "$DADOS/marca"

          echo "::group::Primeira instalação"
          sudo rm -rf "$APP"
          instalar
          test "$(versao)" = "$VERSAO"
          completa
          autoteste autoteste-instalado
          echo "::endgroup::"

          echo "::group::A mesma versão não se reinstala"
          recusa "A mesma versão foi reinstalada."
          grep -q "Não há nada a atualizar" saida.txt
          completa
          echo "::endgroup::"

          echo "::group::Uma versão anterior é atualizada, sem deixar ficheiros dela"
          muda 0.1.0
          sudo touch "$APP/Contents/Frameworks/obsoleto.txt"
          instalar
          test "$(versao)" = "$VERSAO"
          completa
          autoteste autoteste-atualizado
          echo "::endgroup::"

          echo "::group::Uma versão mais recente não é substituída pela linha de comandos"
          muda 9.9.9
          recusa "Desceu de versão sem confirmação."
          grep -q "Warning - Está instalado o Arruma 9.9.9" saida.txt
          sudo grep -F "9.9.9, mais recente do que a versão deste instalador ($VERSAO); fica como está" /var/log/install.log > motivo.txt
          tail -n 1 motivo.txt
          test "$(versao)" = 9.9.9
          echo "::endgroup::"

          echo "::group::Com o Arruma aberto, não instala"
          # Abre-se uma instalação intacta e só depois se muda a versão, para não abrir uma
          # aplicação com a assinatura estragada pelo Info.plist alterado.
          sudo rm -rf "$APP"
          instalar
          "$APP/Contents/MacOS/Arruma" & pid=$!
          for i in $(seq 30); do pgrep -f "$APP/Contents/MacOS/Arruma" >/dev/null && break; sleep 1; done
          pgrep -fl "$APP/Contents/MacOS/Arruma" || { echo "::error::O Arruma não chegou a abrir."; exit 1; }
          muda 0.1.0
          recusa "Substituiu o Arruma aberto."
          sudo grep -F "O Arruma está aberto" /var/log/install.log > motivo.txt
          tail -n 1 motivo.txt
          kill "$pid"; wait "$pid" || true
          test "$(versao)" = 0.1.0
          echo "::endgroup::"

          echo "::group::Cópia da versão 0.2.0 (.dmg): do utilizador, sem recibo e em quarentena"
          sudo rm -rf "$APP"
          sudo pkgutil --forget pt.arruma.Arruma
          ditto dist/Arruma.app "$APP"
          plutil -replace CFBundleShortVersionString -string 0.2.0 "$PLIST"
          touch "$APP/Contents/Frameworks/obsoleto.txt"
          xattr -w com.apple.quarantine '0081;00000000;Safari;' "$APP"
          instalar
          test "$(versao)" = "$VERSAO"
          completa
          if xattr -p com.apple.quarantine "$APP" 2>/dev/null; then echo "::error::Ficou em quarentena."; exit 1; fi
          autoteste autoteste-dmg
          echo "::endgroup::"

          if [ "${{ matrix.arch }}" = apple-silicon ]; then
            echo "::group::O instalador Intel recusa um Mac com processador Apple"
            packaging/macos/make-pkg.sh intel
            mv "dist/Arruma-$VERSAO-macos-intel.pkg" "$RUNNER_TEMP/intel.pkg"
            PKG="$RUNNER_TEMP/intel.pkg"
            recusa "O instalador Intel instalou num Mac com processador Apple."
            grep -q "Este Mac tem um processador Apple" saida.txt
            test "$(versao)" = "$VERSAO"
            echo "::endgroup::"
          fi

          grep -q teste "$DADOS/marca"
          echo "O histórico e as definições de teste continuam lá."
      - uses: actions/upload-artifact@v7
        with:
          name: arruma-macos-${{ matrix.arch }}
          retention-days: 14
          path: dist/*.pkg
      - uses: actions/upload-artifact@v7
        with:
          name: fontes-macos-${{ matrix.arch }}
          retention-days: 14
          path: dist/componentes-*.json

  fontes:
    name: Código-fonte de terceiros
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: fontes-*
          path: fontes
          merge-multiple: true
      - name: Confirmar que o código-fonte de cada componente está disponível
        if: env.ARRUMA_FONTES_NA_EXECUCAO != 'true'
        run: python3 packaging/licencas/fontes.py --verificar fontes/*.json
      - name: Juntar o código-fonte de cada componente, no mesmo sítio que os instaladores
        if: env.ARRUMA_FONTES_NA_EXECUCAO == 'true'
        run: python3 packaging/licencas/fontes.py --saida fontes-terceiros fontes/*.json
      - uses: actions/upload-artifact@v7
        if: env.ARRUMA_FONTES_NA_EXECUCAO == 'true'
        with:
          name: arruma-codigo-fonte-terceiros
          retention-days: 14
          compression-level: 0  # são arquivos já comprimidos
          path: fontes-terceiros/*.tar

  limpar:
    name: Retirar instaladores sem código-fonte
    needs: [windows, macos, fontes]
    # Só quando os instaladores foram construídos para outras pessoas e o código-fonte não ficou junto.
    if: >-
      always() && needs.fontes.result != 'success' &&
      (needs.windows.result != 'skipped' || needs.macos.result != 'skipped') &&
      (!github.event.repository.private || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Apagar os instaladores de Windows e macOS desta execução
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | test("^arruma-(windows|macos-)")) | "\(.id) \(.name)"' |
          while read -r id nome; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            echo "Retirado: $nome"
          done
          echo "::error::O código-fonte de terceiros não ficou junto desta execução, por isso os instaladores de Windows e macOS foram retirados."
          exit 1

  publicar:
    name: Publicar versão
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [testes, linux-instalar, windows, macos, fontes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: arruma-*  # inclui arruma-codigo-fonte-terceiros
          path: artefactos
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artefactos/*
          generate_release_notes: true
          body: |
            Instaladores para Linux (.deb), Windows (instalador e versão portátil) e macOS (Apple Silicon e Intel).
            O Arruma é software livre (GPL-3.0 ou posterior). Os ficheiros .tar «codigo-fonte-terceiros» contêm o
            código-fonte dos componentes de outros autores incluídos nas versões de Windows e macOS; a lista e
            as licenças estão dentro de cada versão, na pasta «licencas».
