# SPDX-License-Identifier: GPL-3.0-or-later
# Avaliação da organização com a IA local real (Ollama), comparando duas versões do código
# em dois conjuntos de documentos fictícios:
# - «desenvolvimento»: o conjunto usado para afinar as regras (os números são otimistas);
# - «validação»: documentos diferentes, nunca usados para afinar nada (o resultado que conta).
# Corre-se à mão em Actions → «Avaliar IA» → Run workflow.
name: Avaliar IA

on:
  workflow_dispatch:
    inputs:
      modelo:
        description: Modelo do Ollama
        default: qwen2.5:3b
      ref_antes:
        description: Versão de referência (commit, ramo ou etiqueta); vazio para avaliar só a atual
        default: 4bee4977e730627225dab2ac9bdf6b572d1c39ce
      so_antes:
        description: Avaliar apenas a versão de referência
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  avaliar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      MODELO: ${{ inputs.modelo }}
      REF_ANTES: ${{ inputs.ref_antes }}
      SO_ANTES: ${{ inputs.so_antes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pip install pillow mutagen pypdf

      - name: Instalar o Ollama e o modelo
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -fsS http://127.0.0.1:11434/api/version; then
            nohup ollama serve > ollama.log 2>&1 &
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/version && break; sleep 1; done
          fi
          ollama pull "$MODELO"
          ollama list

      - name: Código de referência
        if: env.REF_ANTES != ''
        run: |
          mkdir -p antes
          ref=$(git rev-parse --verify --quiet --end-of-options "$REF_ANTES^{commit}") || { echo "Versão inválida: $REF_ANTES"; exit 1; }
          git archive "$ref" arruma | tar -x -C antes

      - name: Avaliar
        run: |
          for conjunto in desenvolvimento validacao; do
            opcao=""; [ "$conjunto" = validacao ] && opcao="--validacao"
            python tests/avaliacao/gerar_corpus.py "corpus-$conjunto" $opcao
            if [ -n "$REF_ANTES" ]; then
              python tests/avaliacao/avaliar.py --codigo antes --corpus "corpus-$conjunto" \
                --saida "antes-$conjunto.json" --modelo "$MODELO"
            fi
            if [ "$SO_ANTES" != "true" ]; then
              python tests/avaliacao/avaliar.py --codigo . --corpus "corpus-$conjunto" \
                --saida "depois-$conjunto.json" --modelo "$MODELO"
            fi
            python tests/avaliacao/comparar.py --antes "antes-$conjunto.json" --depois "depois-$conjunto.json" \
              --esperado "corpus-$conjunto/esperado.json" --saida "relatorio-$conjunto.md" > /dev/null
            { echo "# Conjunto: $conjunto"; echo; cat "relatorio-$conjunto.md"; echo; } >> "$GITHUB_STEP_SUMMARY"
            echo "===== Conjunto: $conjunto ====="
            cat "relatorio-$conjunto.md"
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: avaliacao-ia
          retention-days: 14
          path: |
            antes-*.json
            depois-*.json
            relatorio-*.md
            ollama.log
          if-no-files-found: ignore
